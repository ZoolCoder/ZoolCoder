<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="132" viewBox="0 0 1280 132">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity="0"/><stop offset="1" stop-color="#38e8ff" stop-opacity=".09"/></linearGradient>
<clipPath id="pc"><path d="M16 .5H1279.5V116L1264 131.5H.5V16Z"/></clipPath>
</defs>
<path d="M16 .5H1279.5V116L1264 131.5H.5V16Z" fill="#080d18" stroke="#16243a"/>
<g clip-path="url(#pc)"><rect width="1280" height="132" fill="url(#scan)"/>
<rect class="beam" style="--h:132px" width="1280" height="40" fill="url(#beam)"/></g>
<path d="M.5 34V16L16 .5H34 M1279.5 98V116L1264 131.5H1246" fill="none" stroke="#38e8ff" stroke-width="1.5"/>
<g class="in" style="animation-delay:0.20s"><text x="144" y="66" font-size="30" font-weight="800" fill="#ffb547" text-anchor="middle">2005</text><text x="144" y="96" font-size="11" letter-spacing="2" fill="#38e8ff" text-anchor="middle">FIRST LINE OF CODE</text></g>
<line x1="268" y1="30" x2="268" y2="102" stroke="#16243a"/><g class="in" style="animation-delay:0.35s"><text x="392" y="66" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">14+ yrs</text><text x="392" y="96" font-size="11" letter-spacing="2" fill="#38e8ff" text-anchor="middle">PROFESSIONAL ENGINEERING</text></g>
<line x1="516" y1="30" x2="516" y2="102" stroke="#16243a"/><g class="in" style="animation-delay:0.50s"><text x="640" y="66" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Gov-scale</text><text x="640" y="96" font-size="11" letter-spacing="2" fill="#38e8ff" text-anchor="middle">E-PASSPORT &amp; ID SYSTEMS</text></g>
<line x1="764" y1="30" x2="764" y2="102" stroke="#16243a"/><g class="in" style="animation-delay:0.65s"><text x="888" y="66" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">AWS + GCP</text><text x="888" y="96" font-size="11" letter-spacing="2" fill="#38e8ff" text-anchor="middle">CLOUD CERTIFIED</text></g>
<line x1="1012" y1="30" x2="1012" y2="102" stroke="#16243a"/><g class="in" style="animation-delay:0.80s"><text x="1136" y="66" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Many</text><text x="1136" y="96" font-size="11" letter-spacing="2" fill="#38e8ff" text-anchor="middle">PRODUCTS LIVE TODAY</text></g>
</svg>
