<rect class="beam" style="--h:420px" width="1280" height="40" fill="url(#beam)"/></g>
<path d="M.5 34V16L16 .5H34 M1279.5 386V404L1264 419.5H1246" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text x="22" y="30" font-size="11" letter-spacing="2.5" fill="#5d7689"><tspan fill="#38e8ff">◢ </tspan>STUDIO  //  morning shift</text><circle class="pulse" cx="1252" cy="26" r="3.5" fill="#7dffb2"/><text x="1240" y="30" font-size="11" letter-spacing="2.5" fill="#5d7689" text-anchor="end">COFFEE ONLINE</text><line x1="22" y1="44" x2="1258" y2="44" stroke="#16243a"/><defs>
<linearGradient id="zcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e8ff"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="420" y2="0">
<stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".5" stop-color="#38e8ff"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-260 0;460 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132a57"/><stop offset=".55" stop-color="#c8577a"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
<radialGradient id="sunglow"><stop offset="0" stop-color="#ffd98a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity=".12"/><stop offset="1" stop-color="#38e8ff" stop-opacity=".02"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38e8ff" stop-opacity=".18"/><stop offset="1" stop-color="#38e8ff" stop-opacity="0"/></radialGradient>
</defs><g clip-path="url(#pc)"><ellipse class="glow" cx="1025" cy="220" rx="220" ry="170" fill="url(#halo)"/>
