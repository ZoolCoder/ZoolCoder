<text class="jit b" x="170" y="260" fill="#ffb547" opacity=".45">ZC</text>
<text class="in" style="animation-delay:0.90s" x="170" y="260" fill="url(#zcg)">ZC</text></g><text class="in" style="animation-delay:0.50s" x="300.0" y="222" font-size="48" font-weight="800" fill="url(#sheen)">Z</text><text class="in" style="animation-delay:0.58s" x="328.8" y="222" font-size="48" font-weight="800" fill="url(#sheen)">O</text><text class="in" style="animation-delay:0.66s" x="357.6" y="222" font-size="48" font-weight="800" fill="url(#sheen)">O</text><text class="in" style="animation-delay:0.74s" x="386.4" y="222" font-size="48" font-weight="800" fill="url(#sheen)">L</text><text class="in" style="animation-delay:0.82s" x="415.2" y="222" font-size="48" font-weight="800" fill="url(#sheen)">C</text><text class="in" style="animation-delay:0.90s" x="444.0" y="222" font-size="48" font-weight="800" fill="url(#sheen)">O</text><text class="in" style="animation-delay:0.98s" x="472.8" y="222" font-size="48" font-weight="800" fill="url(#sheen)">D</text><text class="in" style="animation-delay:1.06s" x="501.6" y="222" font-size="48" font-weight="800" fill="url(#sheen)">E</text><text class="in" style="animation-delay:1.14s" x="530.4" y="222" font-size="48" font-weight="800" fill="url(#sheen)">R</text>
