<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity="0"/><stop offset="1" stop-color="#38e8ff" stop-opacity=".09"/></linearGradient>
<clipPath id="pc"><path d="M16 .5H619.5V220L604 235.5H.5V16Z"/></clipPath>
</defs>
<path d="M16 .5H619.5V220L604 235.5H.5V16Z" fill="#080d18" stroke="#16243a"/>
<g clip-path="url(#pc)"><rect width="620" height="236" fill="url(#scan)"/>
<rect class="beam" style="--h:236px" width="620" height="40" fill="url(#beam)"/></g>
<path d="M.5 34V16L16 .5H34 M619.5 202V220L604 235.5H586" fill="none" stroke="#38e8ff" stroke-width="1.5"/>
<text x="24" y="40" font-size="11" letter-spacing="2.5" fill="#5d7689">MODULE <tspan fill="#38e8ff">05</tspan></text>
<g transform="translate(528.8 24)"><rect width="67.2" height="22" fill="#7dffb2" fill-opacity=".1" stroke="#7dffb2" stroke-opacity=".6"/>
<circle class="pulse" cx="12" cy="11" r="3" fill="#7dffb2"/><text x="22" y="15" font-size="10.5" letter-spacing="2" fill="#7dffb2">LIVE</text></g>
<text class="em" x="24" y="95" font-size="26">🐺</text>
<text x="66" y="94" font-size="24" font-weight="700" fill="#ffffff">Social Deduction Game</text>

<text x="24" y="124" font-size="13" fill="#cfe6f0">Party game with a rules engine validated over 5,000 simulated</text><text x="24" y="145" font-size="13" fill="#cfe6f0">games.</text>
<rect x="24.0" y="188" width="46.4" height="24" fill="#38e8ff" fill-opacity=".06" stroke="#38e8ff" stroke-opacity=".4"/><text x="34.0" y="204" font-size="11" fill="#38e8ff">Dart</text><rect x="78.4" y="188" width="66.2" height="24" fill="#38e8ff" fill-opacity=".06" stroke="#38e8ff" stroke-opacity=".4"/><text x="88.4" y="204" font-size="11" fill="#38e8ff">Flutter</text><rect x="152.6" y="188" width="72.8" height="24" fill="#38e8ff" fill-opacity=".06" stroke="#38e8ff" stroke-opacity=".4"/><text x="162.6" y="204" font-size="11" fill="#38e8ff">Riverpod</text>

</svg>
