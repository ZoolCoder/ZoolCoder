<line x1="1008" y1="160" x2="1120" y2="160" stroke="#16243a" stroke-width="2"/><circle class="pkt" cx="1008" cy="160" r="3" fill="#38e8ff" style="--d:112px;animation-delay:1.00s"/><circle class="pkt" cx="1008" cy="160" r="3" fill="#38e8ff" style="--d:112px;animation-delay:1.80s"/>
