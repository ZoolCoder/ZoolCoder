<g clip-path="url(#pc)"><rect width="1280" height="352" fill="url(#scan)"/>
<rect class="beam" style="--h:352px" width="1280" height="40" fill="url(#beam)"/></g>
<path d="M.5 34V16L16 .5H34 M1279.5 318V336L1264 351.5H1246" fill="none" stroke="#38e8ff" stroke-width="1.5"/>
