<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="352" viewBox="0 0 1280 352">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pkt{from{transform:translateX(0);opacity:0}15%,85%{opacity:1}to{transform:translateX(var(--d));opacity:0}}.pkt{animation:pkt 1.6s linear infinite}@keyframes ping{0%{r:52;opacity:.8}100%{r:84;opacity:0}}.ping{animation:ping 2.2s ease-out infinite}.loop{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity="0"/><stop offset="1" stop-color="#38e8ff" stop-opacity=".09"/></linearGradient>
<clipPath id="pc"><path d="M16 .5H1279.5V336L1264 351.5H.5V16Z"/></clipPath>
</defs>
