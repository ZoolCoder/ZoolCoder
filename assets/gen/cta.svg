<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}.nudge{animation:nudge 1.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity="0"/><stop offset="1" stop-color="#38e8ff" stop-opacity=".09"/></linearGradient>
<clipPath id="pc"><path d="M16 .5H1279.5V134L1264 149.5H.5V16Z"/></clipPath>
</defs>
<path d="M16 .5H1279.5V134L1264 149.5H.5V16Z" fill="#080d18" stroke="#16243a"/>
<g clip-path="url(#pc)"><rect width="1280" height="150" fill="url(#scan)"/>
<rect class="beam" style="--h:150px" width="1280" height="40" fill="url(#beam)"/></g>
<path d="M.5 34V16L16 .5H34 M1279.5 116V134L1264 149.5H1246" fill="none" stroke="#38e8ff" stroke-width="1.5"/>
<defs><linearGradient id="ctag" x1="0" x2="1"><stop offset="0" stop-color="#38e8ff" stop-opacity=".16"/><stop offset="1" stop-color="#ffb547" stop-opacity=".1"/></linearGradient></defs>
<rect x="1" y="1" width="1278" height="148" fill="url(#ctag)"/>
<text x="48" y="64" font-size="12" letter-spacing="3" fill="#ffb547">◢ OPEN FOR PROJECTS</text>
<text x="48" y="100" font-size="24" font-weight="700" fill="#ffffff">Have a product to build or AI to bring into your flow?</text>
<g class="nudge"><rect x="950" y="52" width="282" height="52" fill="#38e8ff"/>
<text x="1091" y="84" font-size="16" font-weight="800" letter-spacing="1.5" fill="#04060c" text-anchor="middle">ZOOLCODER.COM →</text></g>
</svg>
