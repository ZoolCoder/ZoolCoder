<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="374" viewBox="0 0 1280 374">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<g class="in" style="animation-delay:0.15s"><path d="M14 0.5H411.5V162L398 175.5H0.5V14Z" fill="#080d18" stroke="#16243a"/><path d="M0.5 30V14L14 0.5H30" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="24" y="58" font-size="30">🤖</text><text x="388" y="36" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.01</text><text x="24" y="86" font-size="17" font-weight="700" fill="#ffffff">AI integration</text><text x="24" y="112" font-size="12.5" fill="#cfe6f0">LLM features, agents, RAG and MCP tools inside</text><text x="24" y="131" font-size="12.5" fill="#cfe6f0">your product and your team&#x27;s delivery flow.</text></g>
<g class="in" style="animation-delay:0.27s"><path d="M448 0.5H845.5V162L832 175.5H434.5V14Z" fill="#080d18" stroke="#16243a"/><path d="M434.5 30V14L448 0.5H464" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="458" y="58" font-size="30">🏢</text><text x="822" y="36" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.02</text><text x="458" y="86" font-size="17" font-weight="700" fill="#ffffff">Enterprise backends</text><text x="458" y="112" font-size="12.5" fill="#cfe6f0">Java 21 / Spring Boot 4 and Go services, contract-</text><text x="458" y="131" font-size="12.5" fill="#cfe6f0">first APIs, microservices, Kafka.</text></g>
<g class="in" style="animation-delay:0.39s"><path d="M882 0.5H1279.5V162L1266 175.5H868.5V14Z" fill="#080d18" stroke="#16243a"/><path d="M868.5 30V14L882 0.5H898" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="892" y="58" font-size="30">🌍</text><text x="1256" y="36" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.03</text><text x="892" y="86" font-size="17" font-weight="700" fill="#ffffff">Arabic-first products</text><text x="892" y="112" font-size="12.5" fill="#cfe6f0">RTL-native web and mobile apps, trilingual</text><text x="892" y="131" font-size="12.5" fill="#cfe6f0">content, built for MENA users.</text></g>
<g class="in" style="animation-delay:0.51s"><path d="M14 198.5H411.5V360L398 373.5H0.5V212Z" fill="#080d18" stroke="#16243a"/><path d="M0.5 228V212L14 198.5H30" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="24" y="256" font-size="30">📱</text><text x="388" y="234" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.04</text><text x="24" y="284" font-size="17" font-weight="700" fill="#ffffff">Offline-first mobile &amp; POS</text><text x="24" y="310" font-size="12.5" fill="#cfe6f0">Flutter apps that keep working without network and</text><text x="24" y="329" font-size="12.5" fill="#cfe6f0">sync when it returns.</text></g>
<g class="in" style="animation-delay:0.63s"><path d="M448 198.5H845.5V360L832 373.5H434.5V212Z" fill="#080d18" stroke="#16243a"/><path d="M434.5 228V212L448 198.5H464" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="458" y="256" font-size="30">⚡</text><text x="822" y="234" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.05</text><text x="458" y="284" font-size="17" font-weight="700" fill="#ffffff">Edge &amp; cloud</text><text x="458" y="310" font-size="12.5" fill="#cfe6f0">Cloudflare Workers, AWS and Google Cloud: fast,</text><text x="458" y="329" font-size="12.5" fill="#cfe6f0">cheap to run, observable.</text></g>
<g class="in" style="animation-delay:0.75s"><path d="M882 198.5H1279.5V360L1266 373.5H868.5V212Z" fill="#080d18" stroke="#16243a"/><path d="M868.5 228V212L882 198.5H898" fill="none" stroke="#38e8ff" stroke-width="1.5"/><text class="em" x="892" y="256" font-size="30">🧊</text><text x="1256" y="234" font-size="11" letter-spacing="2" fill="#5d7689" text-anchor="end">SVC.06</text><text x="892" y="284" font-size="17" font-weight="700" fill="#ffffff">3D &amp; WebXR</text><text x="892" y="310" font-size="12.5" fill="#cfe6f0">Interactive 3D sites and immersive WebXR</text><text x="892" y="329" font-size="12.5" fill="#cfe6f0">experiences that run in the browser.</text></g>
</svg>
