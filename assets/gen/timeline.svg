<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="236" viewBox="0 0 1280 236">
<style>
text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ar{font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:fade .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.rv{clip-path:inset(0 100% 0 0);animation:reveal .14s linear forwards}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.beam{animation:sweep 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:0}}
.trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dash 2.4s cubic-bezier(.4,0,.2,1) .2s forwards}@keyframes ping{0%{r:6;opacity:.9}100%{r:22;opacity:0}}.ping{animation:ping 2s ease-out infinite}@media (prefers-reduced-motion:reduce){.trace{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.rv{clip-path:none}}</style>
<line x1="80" y1="128" x2="1200" y2="128" stroke="#16243a" stroke-width="2"/>
<line class="trace" x1="80" y1="128" x2="1200" y2="128" stroke="#38e8ff" stroke-width="2"/>
<g class="in" style="animation-delay:0.30s"><circle cx="80" cy="128" r="6" fill="#04060c" stroke="#38e8ff" stroke-width="2"/><circle cx="80" cy="128" r="2.5" fill="#38e8ff"/><text class="em" x="80" y="70" font-size="24" text-anchor="middle">💻</text><text x="80" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2005</text><text x="80" y="164" font-size="12" letter-spacing="2" fill="#38e8ff" text-anchor="middle">FIRST CODE</text><text x="80" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">Self-taught, building</text><text x="80" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">since school</text></g>
<g class="in" style="animation-delay:0.65s"><circle cx="304" cy="128" r="6" fill="#04060c" stroke="#38e8ff" stroke-width="2"/><circle cx="304" cy="128" r="2.5" fill="#38e8ff"/><text class="em" x="304" y="70" font-size="24" text-anchor="middle">🏛️</text><text x="304" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2012</text><text x="304" y="164" font-size="12" letter-spacing="2" fill="#38e8ff" text-anchor="middle">GOV PLATFORMS</text><text x="304" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">e-passport portal, civil</text><text x="304" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">registry hub, BI</text></g>
<g class="in" style="animation-delay:1.00s"><circle cx="528" cy="128" r="6" fill="#04060c" stroke="#38e8ff" stroke-width="2"/><circle cx="528" cy="128" r="2.5" fill="#38e8ff"/><text class="em" x="528" y="70" font-size="24" text-anchor="middle">🧪</text><text x="528" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2015</text><text x="528" y="164" font-size="12" letter-spacing="2" fill="#38e8ff" text-anchor="middle">QUALITY ENG.</text><text x="528" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">Selenium automation,</text><text x="528" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">test strategy</text></g>
<g class="in" style="animation-delay:1.35s"><circle cx="752" cy="128" r="6" fill="#04060c" stroke="#38e8ff" stroke-width="2"/><circle cx="752" cy="128" r="2.5" fill="#38e8ff"/><text class="em" x="752" y="70" font-size="24" text-anchor="middle">🪪</text><text x="752" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2017</text><text x="752" y="164" font-size="12" letter-spacing="2" fill="#38e8ff" text-anchor="middle">ID-DOC SYSTEMS</text><text x="752" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">Java EE microservices,</text><text x="752" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">Kubernetes</text></g>
<g class="in" style="animation-delay:1.70s"><circle cx="976" cy="128" r="6" fill="#04060c" stroke="#38e8ff" stroke-width="2"/><circle cx="976" cy="128" r="2.5" fill="#38e8ff"/><text class="em" x="976" y="70" font-size="24" text-anchor="middle">🤖</text><text x="976" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2023</text><text x="976" y="164" font-size="12" letter-spacing="2" fill="#38e8ff" text-anchor="middle">AI + CLOUD</text><text x="976" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">AI champion, LLM agents,</text><text x="976" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">AWS/GCP</text></g>
<g class="in" style="animation-delay:2.05s"><circle class="ping" cx="1200" cy="128" r="6" fill="none" stroke="#ffb547"/><circle cx="1200" cy="128" r="6" fill="#04060c" stroke="#ffb547" stroke-width="2"/><circle cx="1200" cy="128" r="2.5" fill="#ffb547"/><text class="em" x="1200" y="70" font-size="24" text-anchor="middle">🚀</text><text x="1200" y="102" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">NOW</text><text x="1200" y="164" font-size="12" letter-spacing="2" fill="#ffb547" text-anchor="middle">ZOOLCODER</text><text x="1200" y="186" font-size="11.5" fill="#5d7689" text-anchor="middle">Arabic-first, AI-native,</text><text x="1200" y="203" font-size="11.5" fill="#5d7689" text-anchor="middle">many live</text></g>
</svg>
